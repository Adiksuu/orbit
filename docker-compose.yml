version: '3.8'

services:
    frontend:
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        ports:
            - "5173:5173"
        volumes:
            - .:/app
            - /app/node_modules
        environment:
            - NODE_ENV=development
            - VITE_PORT=5173
            - VITE_HMR_HOST=localhost
        restart: unless-stopped
        networks:
            - orbit-network

networks:
    orbit-network:
        driver: bridge
