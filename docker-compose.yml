services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: php
        ports:
            - "8000:8000"
        volumes:
            - .:/app
            # Keep the image-installed dependencies instead of the host's.
            - /app/vendor
        restart: unless-stopped
        tty: true
        stdin_open: true
        networks:
            - orbit-network

    vite:
        build:
            context: .
            dockerfile: Dockerfile
            target: node
        ports:
            - "5173:5173"
        environment:
            - NODE_ENV=development
        volumes:
            - .:/app
            # Keep the image-installed node_modules instead of the host's.
            - /app/node_modules
        # Increase inotify limits to prevent file watcher exhaustion.
        # Without this, Vite's file watching can fail after watching too many files.
        sysctls:
            - fs.inotify.max_user_watches=524288
        restart: unless-stopped
        tty: true
        stdin_open: true
        networks:
            - orbit-network

networks:
    orbit-network:
        driver: bridge
